# Gradle / JVM
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Parchment mappings — readable parameter names + javadoc.
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft / NeoForge
# Latest at https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.228
loader_version_range=[1,)

# Mod
mod_id=vivecraft_sable_compat
mod_name=Vivecraft Sable Compat
mod_license=PolyForm Shield 1.0.0
mod_version=0.2.2
mod_group_id=games.brennan.vivecraftsable
mod_authors=Brennan Hatton
mod_description=Makes Vivecraft VR work while standing on a Sable sub-level. VR teleport lands where you aimed instead of dropping you into the void, and VR melee hits the mobs standing next to you.

# ─────────────────────────────────────────────────────────────────────────────
# Sable — the sub-level / physics mod this compat layer exists to support.
# https://modrinth.com/mod/sable  ·  https://github.com/ryanhcode/sable
#
# MINIMUM range, not an exact pin — deliberately unlike sableportals-mc and
# dungeon-train-mc, which both pin Sable exactly. Those hook Sable *internals*
# (client render pose, physics/collision seams) that move between builds. This
# mod touches none of that: it calls exactly one stable, public companion-API
# method, SableCompanion.projectOutOfSubLevel, and mixes in only to Vivecraft's
# own classes — never to Sable's. An exact pin would break the mod on every
# Sable release for no safety benefit.
#
# NEVER bundled — Sable is PolyForm Shield 1.0.0, which does not permit it.
# End users install Sable separately; neoforge.mods.toml declares it required.
# ─────────────────────────────────────────────────────────────────────────────
sable_version=2.0.5+mc1.21.1

# The bare modId version Sable declares in ITS OWN neoforge.mods.toml (no +mc…
# suffix — that suffix is only Modrinth's artifact coordinate). Rendered into
# our neoforge.mods.toml as versionRange="[${sable_mod_version},)".
# Must equal sable_version's leading semver (the part before '+').
sable_mod_version=2.0.5

# ─────────────────────────────────────────────────────────────────────────────
# Vivecraft — the VR mod whose classes we mix into.
# https://modrinth.com/mod/vivecraft
#
# NOT a compile dependency: every mixin targets Vivecraft by string class name,
# so the mod builds and publishes without it on the classpath. It is pulled in
# runtimeOnly purely so `./gradlew runClient` can start (mods.toml declares
# vivecraft required). This is also the exact build every mixin target was
# verified against with javap — see each mixin's javadoc.
#
# Vivecraft's mods.toml version string carries the MC prefix ("1.21.1-1.3.15"),
# which does not order sanely in a Maven range, so the declared dependency
# range in neoforge.mods.toml stays open and the mixins fail loudly instead.
# ─────────────────────────────────────────────────────────────────────────────
vivecraft_dev_version=1.21.1-1.3.15-neoforge
