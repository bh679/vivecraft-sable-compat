// Vivecraft Sable Compat — Minecraft compat mod (NeoForge 1.21.1).
//
// Makes Vivecraft VR behave correctly while the player stands on a Sable
// sub-level (a moving, physics-driven structure). Client-side only: every fix
// is a mixin into a Vivecraft class, and none of them touch Sable internals.
//
// NeoForge-only, because Sable is NeoForge-only.

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    exclude '**/CLAUDE.md'   // authoring docs — never a MC resource
}

repositories {
    mavenCentral()

    // Modrinth — hosts Sable's mod jars. Sable does not publish to a dedicated
    // Maven, so we pull via Modrinth's Maven proxy (api.modrinth.com/maven).
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            // Auto-join a world instead of stopping at the title screen:
            //   ./gradlew runClient -PquickPlay="New World"
            // The graphics matrix re-runs the same in-world check under three
            // renderer configurations; clicking through the world-select screen
            // each time makes those runs differ in ways nobody records. A project
            // property rather than an env var because a forked run inherits the
            // Gradle daemon's environment, not the invoking shell's.
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.named(mod_id)
    }
}

configurations {
    // Sable bundles its `sable-companion` library as a jar-in-jar inside the
    // mod jar (META-INF/jarjar/sable-companion-common-*.jar). At runtime
    // NeoForge unpacks and loads it; at compile time we have to extract it
    // ourselves so the companion API is visible to javac. SableCompanion is
    // the type that exposes projectOutOfSubLevel — the single Sable call this
    // whole mod rests on — so this is load-bearing, not incidental.
    sableJar
}

dependencies {
    sableJar "maven.modrinth:sable:${sable_version}"
}

tasks.register('extractSableCompanion', Copy) {
    def sableJar = configurations.sableJar
    inputs.files(sableJar)
    from {
        sableJar.collect { zipTree(it).matching {
            include 'META-INF/jarjar/sable-companion-common-*.jar'
        } }
    }
    into layout.buildDirectory.dir('extracted/sable-companion')
    eachFile { details ->
        // Strip the META-INF/jarjar/ prefix so the fileTree below picks the jar up directly.
        details.path = details.sourceName
    }
    includeEmptyDirs = false
}

dependencies {
    // Sable — the mod this compat layer supports. End users install it separately; it
    // is NOT embedded in our jar (PolyForm Shield 1.0.0 does not permit
    // bundling), and neoforge.mods.toml declares it a hard required dep so the
    // loader prompts the user.
    //
    // `implementation` (not `additionalRuntimeClasspath`) because Sable ships
    // its own META-INF/neoforge.mods.toml and must be discoverable by FML as a
    // *mod* on every runtime classpath — including the JUnit test launcher,
    // which inherits from runtimeClasspath but not from the moddev-specific
    // additionalRuntimeClasspath.
    implementation "maven.modrinth:sable:${sable_version}"

    // Vivecraft — needed at DEV RUNTIME ONLY, and only so `runClient` can start:
    // neoforge.mods.toml declares vivecraft a required dependency, so without it
    // on the classpath FML refuses to load this mod and the client stops at an
    // error screen. It is deliberately NOT a compile dependency — every mixin
    // targets Vivecraft by string class name (see the mixin javadocs), which is
    // what keeps this mod buildable and publishable without shipping or
    // resolving Vivecraft's own native/VR dependencies.
    runtimeOnly "maven.modrinth:vivecraft:${vivecraft_dev_version}"

    // Compile against the companion math types extracted from Sable's
    // jar-in-jar bundle. compileOnly because at runtime the companion is loaded
    // by NeoForge from Sable's own jarJar — we don't ship it. fileTree (not
    // files-of-task) so javac sees the .jar inside the directory; builtBy wires
    // the extraction to run before compile.
    compileOnly fileTree(dir: layout.buildDirectory.dir('extracted/sable-companion'),
                         include: '*.jar',
                         builtBy: ['extractSableCompanion'])

    // Unit tests — JUnit 5 Jupiter (pure-logic only).
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Generate neoforge.mods.toml + pack.mcmeta from templates.
tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version       : minecraft_version,
        minecraft_version_range : minecraft_version_range,
        neo_version             : neo_version,
        loader_version_range    : loader_version_range,
        mod_id                  : mod_id,
        mod_name                : mod_name,
        mod_license             : mod_license,
        mod_version             : mod_version,
        mod_authors             : mod_authors,
        mod_description         : mod_description,
        sable_mod_version       : sable_mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir tasks.named('generateModMetadata')
neoForge.ideSyncTask tasks.named('generateModMetadata')

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'    : mod_id,
            'Specification-Vendor'   : mod_authors,
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.jar.archiveVersion,
            'Implementation-Vendor'  : mod_authors,
        ])
    }
}
